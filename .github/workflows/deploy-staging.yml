name: Deploy to Staging

on:
  push:
    branches:
      - staging
  workflow_dispatch:

env:
  PROJECT_ID: oshi-high-485811
  REGION: asia-northeast1
  SERVICE_NAME: oshi-service-staging
  IMAGE_NAME: gcr.io/oshi-high-485811/oshi-service-staging
  TF_STATE_BUCKET: oshi-high-tfstate-staging

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Google Auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Debug GCP identity (hashed output)
        run: |
          # parse the JSON but only output a hash of the fields so the
          # raw values — which are part of the secret — won't be redacted
          EMAIL=$(echo "$GOOGLE_CREDENTIALS" | jq -r '.client_email')
          PROJECT=$(echo "$GOOGLE_CREDENTIALS" | jq -r '.project_id')
          echo "client_email sha256: $(echo -n "$EMAIL" | sha256sum | cut -d' ' -f1)"
          echo "project_id sha256: $(echo -n "$PROJECT" | sha256sum | cut -d' ' -f1)"
          # gcloud auth and config output also hashed
          ACTIVE=$(gcloud auth list --filter=status:ACTIVE --format="value(account)")
          echo "active account sha256: $(echo -n "$ACTIVE" | sha256sum | cut -d' ' -f1)"
          CURRENT=$(gcloud config get-value project)
          echo "current project sha256: $(echo -n "$CURRENT" | sha256sum | cut -d' ' -f1)"
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GCP_SA_KEY }}

      - name: Debug GCP credentials
        run: |
          echo "---- credentials JSON ----"
          echo "$GOOGLE_CREDENTIALS" | jq -r '.client_email, .project_id'
          echo "---- authenticated account ----"
          gcloud auth list --filter=status:ACTIVE --format="value(account)"
          echo "---- current project ----"
          gcloud config get-value project
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GCP_SA_KEY }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init (bootstrap)
        working-directory: ./infra/staging
        run: terraform init

      - name: Bootstrap state bucket
        working-directory: ./infra/staging
        run: |
          # only run the targeted apply if bucket is missing
          if ! gsutil ls -b gs://$TF_STATE_BUCKET >/dev/null 2>&1; then
            terraform apply -input=false -auto-approve -target=google_storage_bucket.state \
              -var="project_id=${{ env.PROJECT_ID }}" \
              -var="db_password=${{ secrets.STAGING_DB_PASSWORD }}" \
              -var="recaptcha_site_key=${{ secrets.STAGING_RECAPTCHA_SITE_KEY }}" \
              -var="recaptcha_secret_key=${{ secrets.STAGING_RECAPTCHA_SECRET_KEY }}"
          else
            echo "state bucket already exists, skipping bootstrap"
          fi
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GCP_SA_KEY }}
          TF_VAR_project_id: ${{ env.PROJECT_ID }}
          TF_VAR_db_password: ${{ secrets.STAGING_DB_PASSWORD }}
          TF_VAR_recaptcha_site_key: ${{ secrets.STAGING_RECAPTCHA_SITE_KEY }}
          TF_VAR_recaptcha_secret_key: ${{ secrets.STAGING_RECAPTCHA_SECRET_KEY }}

      - name: Terraform Init
        working-directory: ./infra/staging
        run: terraform init -backend-config="bucket=${{ env.TF_STATE_BUCKET }}"

      - name: Terraform Plan
        working-directory: ./infra/staging
        run: terraform plan -input=false -var="db_password=${{ secrets.STAGING_DB_PASSWORD }}" -var="project_id=${{ env.PROJECT_ID }}" -var="recaptcha_site_key=${{ secrets.STAGING_RECAPTCHA_SITE_KEY }}" -var="recaptcha_secret_key=${{ secrets.STAGING_RECAPTCHA_SECRET_KEY }}" -out=tfplan
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GCP_SA_KEY }}
          TF_VAR_db_password: ${{ secrets.STAGING_DB_PASSWORD }}
          TF_VAR_project_id: ${{ env.PROJECT_ID }}
          TF_VAR_recaptcha_site_key: ${{ secrets.STAGING_RECAPTCHA_SITE_KEY }}
          TF_VAR_recaptcha_secret_key: ${{ secrets.STAGING_RECAPTCHA_SECRET_KEY }}

      - name: Terraform Apply
        working-directory: ./infra/staging
        # Run non-interactive, apply the saved plan file to make logs explicit
        run: terraform apply -input=false -auto-approve tfplan
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GCP_SA_KEY }}
          TF_VAR_db_password: ${{ secrets.STAGING_DB_PASSWORD }}
          TF_VAR_recaptcha_site_key: ${{ secrets.STAGING_RECAPTCHA_SITE_KEY }}
          TF_VAR_recaptcha_secret_key: ${{ secrets.STAGING_RECAPTCHA_SECRET_KEY }}

      - name: Configure Docker
        run: gcloud auth configure-docker

      - name: Build and Push Container
        run: |
          docker build \
            --platform linux/amd64 \
            --build-arg NEXT_PUBLIC_FIREBASE_API_KEY="${{ secrets.STAGING_NEXT_PUBLIC_FIREBASE_API_KEY }}" \
            --build-arg NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN="${{ secrets.STAGING_NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}" \
            --build-arg NEXT_PUBLIC_FIREBASE_PROJECT_ID="${{ secrets.STAGING_NEXT_PUBLIC_FIREBASE_PROJECT_ID }}" \
            --build-arg NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET="${{ secrets.STAGING_NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}" \
            --build-arg NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID="${{ secrets.STAGING_NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}" \
            --build-arg NEXT_PUBLIC_FIREBASE_APP_ID="${{ secrets.STAGING_NEXT_PUBLIC_FIREBASE_APP_ID }}" \
            -t $IMAGE_NAME:${{ github.sha }} \
            -t $IMAGE_NAME:latest .
          docker push $IMAGE_NAME:${{ github.sha }}
          docker push $IMAGE_NAME:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy $SERVICE_NAME \
            --image $IMAGE_NAME:${{ github.sha }} \
            --region $REGION \
            --platform=managed \
            --allow-unauthenticated \
            --port=8080 \
            --set-env-vars="DATABASE_URL=${{ secrets.STAGING_DATABASE_URL }},NODE_ENV=staging,SMS_PROVIDER=firebase,ENABLE_SMS_MOCK=false,FIREBASE_PROJECT_ID=${{ secrets.STAGING_FIREBASE_PROJECT_ID }},FIREBASE_CLIENT_EMAIL=${{ secrets.STAGING_FIREBASE_CLIENT_EMAIL }},FIREBASE_PRIVATE_KEY=${{ secrets.STAGING_FIREBASE_PRIVATE_KEY }},NEXTAUTH_URL=${{ secrets.STAGING_NEXTAUTH_URL }},NEXTAUTH_SECRET=${{ secrets.STAGING_NEXTAUTH_SECRET }},PHONE_HASH_SECRET=${{ secrets.STAGING_PHONE_HASH_SECRET }},FORCE_REDEPLOY=${{ github.sha }}"

      - name: Get Staging URL
        run: |
          URL=$(gcloud run services describe $SERVICE_NAME --region $REGION --format='value(status.url)')
          echo "✅ Staging deployed: $URL"